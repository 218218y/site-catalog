[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
  ".artifacts",
  ".venv",
  "dist",
  "node_modules",
  "vendor",
]

[tool.ruff.lint]
# Phase 4 starts with correctness rules that are safe to make mandatory across
# the existing codebase. Style and import-order rules can be ratcheted later
# without mixing mass reformatting into behavioral changes.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.13"
files = [
  "tools/catalog_page_numbering.py",
  "tools/taxonomy_editor.py",
  "tools/check_frontend_contracts.py",
  "tools/project_doctor.py",
  "tools/python_toolchain.py",
  "tools/setup_python_env.py",
  "tools/verify_project.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
follow_imports = "silent"
cache_dir = ".artifacts/mypy-cache"
