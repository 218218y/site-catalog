[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
  ".artifacts",
  ".venv",
  "dist",
  "node_modules",
  "vendor",
]

[tool.ruff.lint]
# Correctness rules are mandatory across tools/tests. Formatting and import
# ordering remain intentionally outside this gate so quality checks do not
# create unrelated source churn.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.13"
files = ["tools"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
follow_imports = "silent"
namespace_packages = false
cache_dir = ".artifacts/mypy-cache"
