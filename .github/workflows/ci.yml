name: Project verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Source, unit, build and quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        id: python-setup
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tools/requirements-dev.txt

      - name: Restore Python virtual environment
        id: python-venv-cache
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: python-venv-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.python-setup.outputs.python-version }}-${{ hashFiles('.python-version', 'tools/requirements.txt', 'tools/requirements-dev.txt', 'tools/setup_python_env.py', 'tools/python_toolchain.py') }}

      - name: Remove ephemeral source artifacts
        run: python tools/clean_project_artifacts.py

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Python environment
        run: npm run setup:python

      - name: Save Python virtual environment
        if: steps.python-venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .venv
          key: ${{ steps.python-venv-cache.outputs.cache-primary-key }}

      - name: Run non-browser verification
        run: npm run verify:core

      - name: Verify tests left no source-tree caches
        run: python tools/clean_project_artifacts.py --check

      - name: Upload public SEO preview
        uses: actions/upload-artifact@v7
        with:
          name: public-seo-preview
          if-no-files-found: error
          retention-days: 7
          path: dist/site-public-preview/

  playwright:
    name: Playwright browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Pin the official Playwright image to the exact @playwright/test version.
    # It already contains Chromium and its Linux system dependencies, avoiding
    # a network-sensitive apt install on every fresh GitHub-hosted runner.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PLAYWRIGHT_VISUAL_BASELINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        id: python-setup
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tools/requirements-dev.txt

      # This job restores the shared venv but deliberately does not save it.
      # The verification job is the single cache writer, avoiding concurrent
      # writes on a cold cache while both jobs remain fully independent.
      - name: Restore Python virtual environment
        id: python-venv-cache
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: python-venv-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.python-setup.outputs.python-version }}-${{ hashFiles('.python-version', 'tools/requirements.txt', 'tools/requirements-dev.txt', 'tools/setup_python_env.py', 'tools/python_toolchain.py') }}

      - name: Remove ephemeral source artifacts
        run: python tools/clean_project_artifacts.py

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Python environment
        run: npm run setup:python

      - name: Run Playwright browser tests
        run: npm run test:e2e

      - name: Verify tests left no source-tree caches
        run: python tools/clean_project_artifacts.py --check

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .artifacts/playwright-report/
            .artifacts/playwright-results/
