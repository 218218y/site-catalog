name: Project verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PLAYWRIGHT_VISUAL_BASELINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        id: python-setup
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tools/requirements-dev.txt

      - name: Restore Python virtual environment
        id: python-venv-cache
        uses: actions/cache@v6
        with:
          path: .venv
          key: python-venv-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python-setup.outputs.python-version }}-${{ hashFiles('.python-version', 'tools/requirements.txt', 'tools/requirements-dev.txt') }}

      - name: Resolve Playwright browser version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION="$(node -p 'require("./package-lock.json").packages["node_modules/playwright-core"].version')"
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Remove ephemeral source artifacts
        run: python tools/clean_project_artifacts.py

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Python environment
        run: npm run setup:python

      - name: Install Playwright OS dependencies
        run: npx --no-install playwright install-deps chromium

      - name: Install Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install chromium

      - name: Run complete verification
        run: npm run verify

      - name: Verify tests left no source-tree caches
        run: python tools/clean_project_artifacts.py --check

      - name: Upload public SEO preview
        uses: actions/upload-artifact@v7
        with:
          name: public-seo-preview
          if-no-files-found: error
          retention-days: 7
          path: dist/site-public-preview/

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .artifacts/playwright-report/
            .artifacts/playwright-results/
